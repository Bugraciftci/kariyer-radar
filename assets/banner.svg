    <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#2DD4BF" stroke-opacity="0.24" stroke-width="1.5" />
    <rect x="490" y="34" width="220" height="26" rx="13" fill="#14B8A6" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.4" />
