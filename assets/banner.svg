      <stop offset="0%" stop-color="#070C14" />
      <stop offset="55%" stop-color="#0D1B2A" />
      <stop offset="100%" stop-color="#102A3A" />
    </linearGradient>
    <radialGradient id="g1" cx="20%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.28" />
