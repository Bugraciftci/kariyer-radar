<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260" role="img" aria-label="Kariyer Radar — Multi-Sector Job Aggregation Engine &amp; FastAPI Dashboard">
  <defs>
